<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4b8d71">
  <meta name="description" content="Grow a little garden, play fruit puzzles, and build a village of your own. Fruit Bloom is playable offline in English and Vietnamese.">
  <title>Fruit Bloom · Willowbrook</title>
  <link rel="stylesheet" href="src/styles.css">
  <link rel="stylesheet" href="src/world.css">
  <link rel="stylesheet" href="src/puzzle.css">
  <link rel="stylesheet" href="src/typography.css">
</head>
<body>
  <main id="game" aria-label="Fruit Bloom">
    <div id="world-mount"></div>
    <header id="hud" class="hud"></header>
    <aside id="quest-panel" class="quest-panel"></aside>
    <aside id="side-panel" class="side-panel"></aside>
    <div id="mode-hint" class="mode-hint"></div>
    <nav id="dock" class="dock" aria-label="Village activities"></nav>
    <div id="camera-controls" class="camera-controls"></div>
    <div id="save-status" class="save-status"></div>
    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="portrait-message" class="portrait-message"></div>
  </main>
  <script src="src/i18n.js"></script>
  <script src="src/ui-copy.js"></script>
  <script src="src/icons.js"></script>
  <script src="src/game-state.js"></script>
  <script src="src/world-art.js"></script>
  <script src="src/world.js"></script>
  <script src="src/puzzle.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
