<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#193f35">
  <meta name="description" content="Fruit Bloom — a little garden, a world of possibilities. An interactive village prototype.">
  <title>Fruit Bloom — Your little garden</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main id="game" aria-label="Fruit Bloom">
    <div class="ambient-sky" aria-hidden="true"></div>
    <div id="viewport" class="viewport"><div id="world" class="world"></div></div>
    <div class="vignette" aria-hidden="true"></div>
    <header id="hud" class="hud"></header>
    <section id="village-heading" class="village-heading"></section>
    <aside id="garden-note" class="garden-note"></aside>
    <div id="camera-controls" class="camera-controls"></div>
    <div id="scene-caption" class="scene-caption"></div>
    <nav id="navigation" class="navigation" aria-label="Main navigation"></nav>
    <div id="demo-badge" class="demo-badge"></div>
    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="portrait-prompt" class="portrait-prompt"></div>
  </main>
  <script src="src/data.js"></script>
  <script src="src/i18n.js"></script>
  <script src="src/icons.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
